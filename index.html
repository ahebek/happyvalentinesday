<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="clouds"></div>
    <canvas class="hearts"></canvas>
    <div class="container">
        <h1>Happy Valentine's Day!</h1>
        <div class="slideshow">
            <div class="slides">
                <div class="slide">
                    <p class="note">You are my favorite person. Happy Valentine's Day!</p>
                </div>
                <div class="slide">
                    <img src="image1.jpg" alt="Memory 1">
                </div>
                <div class="slide">
                    <img src="image2.jpg" alt="Memory 2">
                </div>
                <div class="slide">
                    <img src="image3.jpg" alt="Memory 3">
                </div>
            </div>
        </div>
        <audio controls autoplay loop>
            <source src="are-you-even-real.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>
    <script src="script.js"></script>
</body>
</html>
